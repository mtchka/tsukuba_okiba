<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>つくばおきば | 筑波大学新入生歓迎委員会</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div id="app">

      <div id="map"></div>

    <div class="title-overlay">
      <h1>つくばおきば</h1>
      <p>筑波大学を色々な場所に置いてみよう！</p>
    </div>


    
    <div class="mode-controls">
      <button
        id="mode-toggle"
        class="mode-btn"
        type="button"
        aria-label="設置モードに切り替える"
      >
        <img src="./move.svg" alt="" />
      </button>
    </div>

        <a
        href="https://www.stb.tsukuba.ac.jp/~shinkan/"
        class="svg-button"
        aria-label="リンク先へ移動"
      >
        <img src="./shinkancomm_logo_full.svg" alt="" />
      </a>



      <footer class="control-footer">

        <div class="controls">
          
          <div class="menu-group">
            <label for="rotation-slider">回転</label>
            <input
              type="range"
              id="rotation-slider"
              min="-360"
              max="360"
              value="0"
            />
            <span id="rotation-value">0°</span>
          </div>

          <div class="menu-group">
            <label for="opacity-slider">不透明度</label>
            <input
              type="range"
              id="opacity-slider"
              min="0"
              max="100"
              value="100"
            />
            <span id="opacity-value">100%</span>
          </div>

      </div>

      </footer>

    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script src="./app.js"></script>
  </body>
</html>
