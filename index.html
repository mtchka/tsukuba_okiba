<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>つくばおきば | 筑波大学新入生歓迎委員会</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hero">
        <div class="hero-top">
          <div>
            <h1>つくばおきば</h1>
            <p>筑波大学を色々な場所に設置してみよう！</p>
          </div>
          <div class="controls" role="toolbar" aria-label="shape mode">
            <button class="mode-btn active" data-mode="centered">画面中央</button>
            <button class="mode-btn" data-mode="fixed">地図固定</button>
          </div>
        </div>
      </header>
      <div id="map"></div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./app.js"></script>
  </body>
</html>
